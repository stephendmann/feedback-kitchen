name: FK Claude Review Retry

# Encodes the retry budget that has been applied by hand: when a review
# abandons itself mid-flight, re-run it, up to three runs in all.
#
# This lives in its own workflow because a run cannot re-run itself. A retry job
# inside the review workflow keeps that run in progress while it executes, and
# GitHub refuses `gh run rerun` on an in-progress run, so the call fails and the
# retry never happens. `workflow_run` fires after the run has finished, which is
# the only point a re-run is accepted.
#
# See #163 for the failure being worked around. The cause is upstream: the review
# reaches a wait-and-resume primitive in a one-shot runner that has no next turn,
# so it suspends forever and the action still exits zero.

on:
  workflow_run:
    workflows: ["FK Claude PR Review"]
    types: [completed]

jobs:
  retry:
    name: Retry an abandoned review
    # The run_attempt cap is what makes a loop impossible: a re-run increments it,
    # so once it reaches the cap nothing here fires again, whatever the review does.
    # Every attempt below the cap that abandons gets one re-run, so a run that fails
    # for another reason on attempt 1 and is then re-run by hand still gets retried
    # if that attempt abandons (the PR #162 pattern in #163). Three attempts in all.
    # Keep a numeric cap here if anything is ever edited.
    if: >-
      github.event.workflow_run.conclusion == 'failure'
      && github.event.workflow_run.run_attempt < 3
    runs-on: ubuntu-latest
    permissions:
      actions: write        # rerunning a run needs it; nothing else here does

    steps:
      - name: Re-run the review once, but only if it abandoned
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          REPO: ${{ github.repository }}
        run: |
          # The guard prints its own verdict, so this reads the classifier's
          # conclusion as a fact rather than interpreting the review's prose,
          # which is the distinction #142 was about.
          LOG=$(gh run view "$RUN_ID" --repo "$REPO" --log-failed 2>/dev/null || true)

          if [ -z "$LOG" ]; then
            echo "No failed-step log for run $RUN_ID. Leaving it alone."
            exit 0
          fi

          # Anchored to the start of a log line's text, after the timestamp. The log
          # also echoes this job's own script, and the review workflow's comment
          # there quotes "FAIL: ... abandoned", so an unanchored pattern matched
          # every failure and retried reviews that had not abandoned (PR #181).
          if ! printf '%s' "$LOG" | grep -qE '[0-9]Z FAIL[^:]*: .*abandoned'; then
            # An errored run or an empty review can be about the diff, so retrying
            # spends money to reach the same answer and loses the red check that is
            # the point. Only abandonment is transient.
            echo "Run $RUN_ID failed for some reason other than abandonment. Leaving it red."
            exit 0
          fi

          echo "Run $RUN_ID abandoned itself waiting on background agents (#163). Retrying once."
          gh run rerun "$RUN_ID" --repo "$REPO" --failed
