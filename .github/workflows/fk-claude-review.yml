name: FK Claude PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

# Cancel an in-flight review when the PR is updated again, so rapid pushes
# don't run several full reviews in parallel (saves API + Actions minutes).
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    name: Claude code review (read-only)
    # Two exclusions, both because the job would run without a usable credential:
    #  - Fork PRs get a read-only token and no secrets.
    #  - Dependabot PRs run in a separate context where GitHub withholds regular
    #    Actions secrets, so CLAUDE_CODE_OAUTH_TOKEN resolves empty and the review
    #    fails on turn 1 at $0 — the same signature as a genuinely empty secret.
    #    Skipping keeps that permanent, misleading red off every dependency bump.
    #    See docs/troubleshooting.md, "The Claude review fails only on Dependabot PRs".
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository
      && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: read        # read repo for context; never pushes from CI
      pull-requests: write  # post the review
      issues: write         # comment API path for PR conversations
      id-token: write       # required by claude-code-action for its OIDC auth handshake

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Claude review (code, PRs into main)
        # The code-review skill, for PRs carrying application code. It decides
        # for itself whether a PR is worth examining and reviews a PR once.
        if: github.event.pull_request.base.ref != 'manual'
        # Pinned to the SHA from the last known-good run, as standard hardening
        # against a third-party action moving under us. This pin was NOT what fixed
        # the 2026-07 outage: the review failed fast (1 turn, $0) from 18 Jul to 25
        # Jul because the CLAUDE_CODE_OAUTH_TOKEN secret was empty, and pinning was
        # a red herring pursued before that was found. Kept because floating @v1 is
        # still worth avoiding. See docs/troubleshooting.md, "The Claude review job
        # fails in seconds", for the full post-mortem.
        uses: anthropics/claude-code-action@558b1d6cab4085c7753fe402c10bef0fbb92ac7a # v1 as of 2026-07-06
        with:
          # Authenticates with the Claude Pro subscription (claude setup-token),
          # so CI reviews draw from the plan allocation rather than API billing.
          # If this secret is empty the job fails on turn 1 at $0 with no visible
          # error; `gh secret list` confirms it exists.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Runs the same `code-review` skill used locally via /code-review,
          # for consistent behaviour between local and CI reviews.
          plugin_marketplaces: "https://github.com/anthropics/claude-code.git"
          plugins: "code-review@claude-code-plugins"
          # --comment is what makes the review reach the PR. Posting is opt-in in
          # the code-review skill: without the flag it reviews normally and reports
          # to its caller, which in CI is log output nobody reads. That is why every
          # run from #69 to #130 was green, silent, and — after the OAuth fix — paid
          # for (#130 cost $2.32 for 24 turns that produced nothing). See #112.
          prompt: "/code-review:code-review ${{ github.repository }}/pull/${{ github.event.pull_request.number }} --comment"
          claude_args: >-
            --append-system-prompt "Feedback Kitchen is an academic assessment / rubrics
            web app. Treat student data as sensitive: never recommend logging or exposing
            raw student identifiers. Weight findings toward grading/rubric correctness,
            data privacy, and performance on large cohorts. The repo CLAUDE.md and
            planning docs carry FK conventions — honour them."

      # PRs into `manual` carry chapters of the rewritten user manual, where the
      # defects are wrong statements about how the application behaves rather
      # than bugs. The code-review skill is the wrong instrument for that: it
      # judges a markdown diff trivial and skips (#133, #135), and it reviews a
      # PR once, so amendments made in response to feedback land unreviewed
      # (#136). Every real defect found in the chapters so far came from reading
      # them against source, not from diff review.
      #
      # So this is a direct prompt rather than the skill. It runs on every push,
      # which is deliberate: re-reviewing amendments closes the one-shot gap and
      # restores the guard coverage #142 had to narrow.
      - name: Claude review (chapters, PRs into manual)
        if: github.event.pull_request.base.ref == 'manual'
        uses: anthropics/claude-code-action@558b1d6cab4085c7753fe402c10bef0fbb92ac7a # v1 as of 2026-07-06
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Review PR #${{ github.event.pull_request.number }} in ${{ github.repository }}.
            It changes chapters of the Feedback Kitchen user manual under manual/.

            Read each changed chapter IN FULL, not just the diff. Then verify every
            statement it makes about how the application behaves against the source,
            and write your findings to $GITHUB_WORKSPACE/chapter-review.md.

            Write that file with a Bash heredoc, not the Write tool:

              cat > "$GITHUB_WORKSPACE/chapter-review.md" <<'FINDINGS'
              ...your markdown...
              FINDINGS

            This is not a style preference. In this session the Write tool is gated
            and network commands are blocked, and both have already cost a completed
            review that could not deliver it. Bash works. Do not try to post to the
            PR yourself: a later workflow step posts the file for you.

            Write the file even when you find nothing, saying so and naming what you
            checked. A missing or empty file fails the build.

            How to verify:
            - Open the code a claim depends on and read it. Follow the call chain far
              enough to see what actually happens, including paths the chapter does not
              mention. A claim can be true of the function named and false of the
              function it calls.
            - Watch for conditions that are necessary but not sufficient. A chapter
              saying an action happens "when X" is wrong if X is required but the
              action also needs Y. This has been the single most common defect.
            - Treat claims about what leaves the device, what is stored locally, and
              what is sent to a third party as the highest stakes. Check the request
              bodies and the storage keys yourself.
            - Check the changed chapters against the rest of manual/. Two chapters
              describing the same control differently has happened repeatedly, and the
              wrong one is not always the one being changed.
            - Check UI labels, storage keys, file names, thresholds and counts against
              the code that defines them.

            Report EVERY factual inaccuracy you can substantiate, with a file:line
            citation for the manual text and for the code that contradicts it. Do not
            filter by confidence or severity, and do not decide the PR is too small or
            too obvious to review: a one-line documentation change can be the wrong
            line. If you find nothing, say so and name what you checked.

            Style findings are secondary. Report them only alongside a factual finding,
            or if a chapter breaks CLAUDE.md's writing rules badly enough to mislead.
          claude_args: >-
            --append-system-prompt "Feedback Kitchen is an academic assessment / rubrics
            web app whose users are markers handling real student data. A manual that
            describes a privacy or data-retention behaviour incorrectly can cause a
            marker to leave student work on a shared machine, so accuracy about storage,
            transmission and clearing behaviour matters more than any style concern.
            Honour the repo CLAUDE.md conventions."

      # The chapter review writes its findings to a file and this step posts them.
      # The review cannot post for itself: `gh` and `curl` are both blocked inside
      # that session, which cost a whole review on #146 (65 turns, $1.94, findings
      # stranded in the transcript). Posting from the runner, where the token
      # already works, removes the dependency rather than trying to grant it.
      #
      # It also gives the guard a fact to check. Whether a review posted was
      # previously decided by matching its own prose, the fragility #142 traced;
      # now the file either exists with content or it does not.
      - name: Post chapter review findings
        if: always() && github.event.pull_request.base.ref == 'manual'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Same exemption the guard takes. A PR editing this workflow is skipped
          # by the action's own validation guard before the review runs at all,
          # so there is no findings file to post and its absence is expected, not
          # a failure. Sync PRs are unaffected, since their copy of the file
          # matches the default branch, but a deliberate workflow change into
          # manual would go red here without this.
          if gh pr view "${{ github.event.pull_request.number }}" \
               --repo "${{ github.repository }}" --json files \
               --jq '.files[].path' \
             | grep -qx '.github/workflows/fk-claude-review.yml'; then
            echo "This PR edits fk-claude-review.yml, so the review was skipped and wrote no findings. Nothing to post."
            exit 0
          fi
          F="${GITHUB_WORKSPACE}/chapter-review.md"
          if [ ! -s "$F" ]; then
            echo "No chapter-review.md, or it is empty: the review produced nothing to post."
            exit 1
          fi
          gh pr comment "${{ github.event.pull_request.number }}" \
            --repo "${{ github.repository }}" --body-file "$F"
          echo "Posted $(wc -c < "$F") bytes of findings."

      # The job log carries only the action's init and result JSON, not the turns.
      # The full transcript — including which tools hit permission_denials_count —
      # is written to the runner temp and dies with the runner, so a silent or
      # failed review cannot be diagnosed after the fact. Keeping it makes the next
      # instance debuggable. if: always() so a failed review is the case it covers.
      - name: Upload Claude execution log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: claude-execution-output-${{ github.event.pull_request.number }}
          path: ${{ runner.temp }}/claude-execution-output.json
          if-no-files-found: warn
          retention-days: 30

      # The action exits zero whatever happens, so a green check has never meant
      # "this PR was reviewed" (#136). This reads the log uploaded above and
      # fails the job when the run errored or abandoned itself mid-flight, while
      # letting a deliberate skip on a trivial PR stay green. Runs after the
      # upload so the artifact survives a failing job.
      #
      # Non-blocking: this check is not required and main has no branch
      # protection, so it makes a dead review visible without stopping a merge.
      - name: Check the review actually reviewed
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A PR that edits this workflow is skipped by the action's own
          # validation guard before it writes any log, so the missing log is
          # expected there rather than a failure. gh rather than `git diff`
          # because actions/checkout is shallow and has no merge base.
          if gh pr view "${{ github.event.pull_request.number }}" \
               --repo "${{ github.repository }}" --json files \
               --jq '.files[].path' \
             | grep -qx '.github/workflows/fk-claude-review.yml'; then
            echo "This PR edits fk-claude-review.yml, so the action's validation guard skips it. Exempt."
            exit 0
          fi
          LOG="${{ runner.temp }}/claude-execution-output.json"

          if [ "${{ github.event.pull_request.base.ref }}" = "manual" ]; then
            # Chapter reviews have no legitimate skip: the prompt reviews every
            # push. Whether one produced findings is settled by the file the
            # posting step above consumed, not by reading the review's prose,
            # which is the fragility #142 traced. --posted says that fact is
            # already established, leaving only errors and abandonment to catch.
            if [ -s "${GITHUB_WORKSPACE}/chapter-review.md" ]; then
              node scripts/check-review-outcome.js --posted "$LOG"
            else
              node scripts/check-review-outcome.js --strict "$LOG"
            fi
            exit $?
          fi

          # Code reviews use the skill, which reviews a PR once. Every later push
          # legitimately stops without posting, and words that differently each
          # time (#142), so settle it by fact rather than by matching prose.
          if gh pr view "${{ github.event.pull_request.number }}" \
               --repo "${{ github.repository }}" --json comments \
               --jq '.comments[].author.login' \
             | grep -qi '^claude$'; then
            echo "A Claude review comment already exists, so the skill's one-shot policy skips this run. Exempt."
            exit 0
          fi
          node scripts/check-review-outcome.js "$LOG"
