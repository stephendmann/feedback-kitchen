name: FK Claude PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

# Cancel an in-flight review when the PR is updated again, so rapid pushes
# don't run several full reviews in parallel (saves API + Actions minutes).
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    name: Claude code review (read-only)
    # Fork PRs run with a read-only token and no secrets, so the API key and
    # comment-post would fail — only review PRs from branches in this repo.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: read        # read repo for context; never pushes from CI
      pull-requests: write  # post the review
      issues: write         # comment API path for PR conversations
      id-token: write       # required by claude-code-action for its OIDC auth handshake

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ==================== TEMPORARY DIAGNOSTIC ====================
      # This job is NOT reviewing pull requests right now. It runs a minimal
      # prompt with no plugin, to answer one question: can CI reach Claude at
      # all? See docs/troubleshooting.md, "The Claude review job fails in
      # seconds", for why the usual suspects have been eliminated.
      #
      #   1 turn and $0        -> auth, entitlement, or a rate limit
      #   a real reply, >$0    -> the /code-review:code-review command
      #
      # REVERT THIS as soon as its canary pull request has run:
      #   git revert <this commit>
      # The review configuration it replaces is in that commit's diff.
      # Because of the workflow-validation guard, reverting also needs a
      # separate pull request that touches no workflow file before the real
      # review runs again.
      # ==============================================================
      - name: Claude review
        # Pinned to the last SHA that produced a real review (2026-07-06: 10 turns,
        # non-zero cost, is_error false). The mutable @v1 tag moved twice after that
        # (3553f843 on 18 Jul, 44423bd on 24 Jul) and both fast-fail in under a minute
        # with num_turns 1 and $0 cost. Pinning also removes a silent moving dependency.
        # See docs/troubleshooting.md for how to tell a moved tag from an expired token.
        uses: anthropics/claude-code-action@558b1d6cab4085c7753fe402c10bef0fbb92ac7a # v1 as of 2026-07-06
        with:
          # Authenticates with the Claude Pro subscription (claude setup-token),
          # so CI reviews draw from the plan allocation rather than API billing.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # DIAGNOSTIC: no plugin, no marketplace, no system prompt, and a
          # prompt that needs no repository context. Every moving part except
          # the credential is removed, so the result is unambiguous.
          prompt: "Reply with exactly: OK"
