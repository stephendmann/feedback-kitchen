name: CI

on:
  push:
    branches: [main]
  pull_request:
    # Filters on the PR's BASE branch, so `manual` is needed here for the
    # 48-chapter manual rewrite to get any CI at all. Without it a PR into
    # manual runs nothing — no Build & Test, no CodeQL.
    branches: [main, manual]

jobs:
  ci:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Lazy-load guard
        run: npm run guard:lazy-load

      - name: Test
        run: npm test
